version: "3.8"

services:
  xgo:
    image: ghcr.io/charmillionaire/xgo:latest
    container_name: xgo
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./server/data:/app/server/data
      - ./server/music:/app/server/music
      - ./server/PC:/app/server/PC
      - ./server/APP:/app/server/APP
      - ./server/doc:/app/server/doc
      - ./server/icon-cache:/app/server/icon-cache
    environment:
      - TZ=Asia/Shanghai
